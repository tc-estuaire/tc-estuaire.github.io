<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAINT-NAZAIRE | TC ESTUAIRE</title>
    <style>
        /* Couleurs bouton orange */
        :root {
            --primary: #ff9800;
            --primary-dark: #e08900;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 100px;
        }
        h1 {
            color: #000000;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        .menu-liste {
            margin: 20px 0;
            padding-left: 20;
            list-style-type: none;
        }
        .menu-liste li {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        /* flèche devant chaque ligne */
        .menu-liste li::before {
            content: "➔";
            margin-right: 10px;
            color: #000000;
            font-size: 15px;
        }
        /* Style des boutons basiques */
        .btn-classique {
            display: inline-block;
            padding: 10px 12px;
            background-color: #f0f0f0;
            color: #000000;
            text-decoration: none;
            border: 1px solid #767676;
            border-radius: 3px;
            font-size: 14px;
        }
        .btn-classique:hover {
            background-color: #e5e5e5;
            border-color: #4f4f4f;
        }
        /* Style pour les futures pages en attente */
        .btn-indisponible {
            display: inline-block;
            padding: 10px 12px;
            background-color: #ffffff;
            color: #888888;
            text-decoration: none;
            border: 1px solid #cccccc;
            border-radius: 3px;
            font-size: 14px;
            cursor: not-allowed;
			margin-top: 10px;
        }
        
        /* Style bouton retour */
        .back-link { 
            display: inline-block; 
            margin-bottom: 25px; 
            color: white;
            background-color: var(--primary); 
            padding: 10px 20px;
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 5px rgba(255,152,0,0.2);
			margin-top: 100px;
        }

        .back-link:hover {
            background-color: var(--primary-dark); 
        }

    </style>
</head>
<body>

            </a>
        </li>

        <li>
            <span class="btn-indisponible">
                Les dates importantes ! (PATIENCE...)
            </span>
        </li>
    </ul>
